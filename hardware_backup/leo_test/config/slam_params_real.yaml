slam_toolbox:
  ros__parameters:
    use_sim_time: false

    odom_frame: odom
    map_frame: map
    base_frame: base_link    # base_link is correct — we publish base_footprint->base_link from NUC
    scan_topic: /scan

    mode: mapping

    resolution: 0.05
    max_laser_range: 10.0
    minimum_time_interval: 0.5
    transform_publish_period: 0.02

    map_update_interval: 1.0

    transform_timeout: 1.0       # generous timeout for real hardware
    tf_buffer_duration: 60.0

    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2

    use_scan_matching: true
    use_scan_barycenter: true

    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    map_file_name: /home/team7/maps/my_map
    map_start_at_dock: true


    use_lifecycle_manager: false  # Auto-activates on start
    
    # Your existing params
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    # ... rest of your params